apiVersion: v1
kind: ServiceAccount
metadata:
  name: healing-agent
  namespace: sre-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: healing-agent-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "deployments/scale"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: healing-agent-binding
subjects:
- kind: ServiceAccount
  name: healing-agent
  namespace: sre-demo
roleRef:
  kind: ClusterRole
  name: healing-agent-role
  apiGroup: rbac.authorization.k8s.io
