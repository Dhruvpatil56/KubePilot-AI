apiVersion: v1
kind: ServiceAccount
metadata:
  name: healing-agent
  namespace: sre-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healing-agent-role
  namespace: sre-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "events"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healing-agent-binding
  namespace: sre-demo
subjects:
  - kind: ServiceAccount
    name: healing-agent
    namespace: sre-demo
roleRef:
  kind: Role
  name: healing-agent-role
  apiGroup: rbac.authorization.k8s.io
