apiVersion: apps/v1
kind: Deployment
metadata:
  name: healing-agent
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healing-agent
  template:
    metadata:
      labels:
        app: healing-agent
    spec:
      serviceAccountName: healing-agent
      containers:
      - name: healing-agent
        image: healing-agent:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: LLM_PROVIDER
          value: "groq"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubepilot-secrets
              key: GROQ_API_KEY
        - name: GROQ_MODEL
          value: "llama-3.3-70b-versatile"
        - name: K8S_NAMESPACE
          value: "sre-demo"
        - name: ENABLE_AUTO_REMEDIATION
          value: "true"
        - name: DRY_RUN
          value: "true"
        - name: CONFIDENCE_THRESHOLD
          value: "0.7"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
