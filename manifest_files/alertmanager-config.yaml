apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kubepilot-webhook
  namespace: sre-demo
  labels:
    alertmanagerConfig: kubepilot
spec:
  route:
    receiver: kubepilot-webhook
    groupBy: ['alertname', 'namespace', 'pod']
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 5m
  receivers:
  - name: kubepilot-webhook
    webhookConfigs:
    - url: 'http://healing-agent.sre-demo.svc.cluster.local:8000/webhook/alert'
      sendResolved: false
